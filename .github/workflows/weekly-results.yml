# Moravian Gators – týdenní výsledky
# Každé pondělí v 18:00 Europe/Prague (českého času).
#
# POZN.: GitHub Actions používá UTC, a Evropa má DST.
#   - Letní čas (CEST, UTC+2): 18:00 Praha = 16:00 UTC → cron "0 16 * * 1"
#   - Zimní čas (CET,  UTC+1): 18:00 Praha = 17:00 UTC → cron "0 17 * * 1"
# Obě crony jsou naplánované a krok "Skip if not 18:00 Prague time"
# propustí dál jen tu, která odpovídá aktuálnímu DST.
#
# Retry logika: pokud výsledky nejsou finalizovány (exit code 75),
# workflow se spustí znovu za 3 hodiny (21:00 Praha).

name: Weekly Results

on:
  schedule:
    # 18:00 Praha (primární běh)
    - cron: "0 16 * * 1"  # CEST (letní čas)
    - cron: "0 17 * * 1"  # CET  (zimní čas)
    # 21:00 Praha (retry #1, pokud PDGA ještě neindexovala)
    - cron: "0 19 * * 1"  # CEST
    - cron: "0 20 * * 1"  # CET
  workflow_dispatch:
    # Ruční spuštění z GitHub webu (pro testování)
    inputs:
      date:
        description: "Datum soboty víkendu (YYYY-MM-DD), prázdné = minulý víkend"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  send-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Skip if not target Prague time
        id: tz-check
        # Primární běh propustí v 18:00 Praha, retry v 21:00 Praha.
        # Ruční spuštění (workflow_dispatch) projde vždy.
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run – proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PRAGUE_HOUR=$(TZ="Europe/Prague" date +%H)
          echo "Prague hour now: $PRAGUE_HOUR"
          case "$PRAGUE_HOUR" in
            18|21) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *)     echo "skip=true"  >> "$GITHUB_OUTPUT"
                   echo "Cron spuštěn mimo cílovou hodinu ($PRAGUE_HOUR Praha) – konec." ;;
          esac

      - name: Checkout
        if: steps.tz-check.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Check if already sent today
        id: check-sent
        if: steps.tz-check.outputs.skip == 'false'
        # Přeskočí retry běhy, pokud už dnes úspěšně proběhl
        run: |
          git log --oneline --since="$(date -u +%Y-%m-%dT00:00:00Z)" --grep="data: update results" | head -1
          if git log --oneline --since="$(date -u +%Y-%m-%dT00:00:00Z)" --grep="data: update results" | grep -q .; then
            echo "already_sent=true" >> "$GITHUB_OUTPUT"
            echo "Výsledky už byly dnes odeslány, přeskakuji."
          else
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.tz-check.outputs.skip == 'false' && steps.check-sent.outputs.already_sent == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.tz-check.outputs.skip == 'false' && steps.check-sent.outputs.already_sent == 'false'
        run: pip install -r requirements.txt

      - name: Run agent
        if: steps.tz-check.outputs.skip == 'false' && steps.check-sent.outputs.already_sent == 'false'
        id: run-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          set +e
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python main.py --date "${{ github.event.inputs.date }}"
          else
            python main.py
          fi
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 75 ]; then
            echo "⏳ Výsledky nejsou finalizovány. Další pokus proběhne automaticky."
            echo "incomplete=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ $EXIT_CODE -ne 0 ]; then
            exit $EXIT_CODE
          fi
          echo "incomplete=false" >> "$GITHUB_OUTPUT"

      - name: Commit cumulative data
        if: steps.tz-check.outputs.skip == 'false' && steps.check-sent.outputs.already_sent == 'false' && steps.run-agent.outputs.incomplete != 'true'
        run: |
          git config user.name "Gators Bot"
          git config user.email "bot@moraviangators.cz"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: update results $(date +%Y-%m-%d)"
            git push
          fi

      - name: Upload results artifact
        if: always() && steps.tz-check.outputs.skip == 'false' && steps.check-sent.outputs.already_sent == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_id }}
          path: output/
          retention-days: 30
