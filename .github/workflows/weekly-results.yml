# Moravian Gators – týdenní výsledky
# Každé pondělí 4 pokusy: 9:00, 12:00, 15:00, 18:00 Europe/Prague.
#
# První úspěšný běh pushne commit `data: update results YYYY-MM-DD`
# (i empty commit, pokud žádné nové turnaje). Všechny pozdější pokusy
# téhož dne tento marker vidí a skipnou. Tím se ošetří:
#   – předčasný běh, kdy PDGA ještě nezindexovala (selhání → další pokus)
#   – víkend bez turnajů (empty commit zachytí marker, e-mail se pošle 1x)
#   – GHA cron lag (~30 min) bez křehkého TZ-checku
#
# Schedule pokrývá obě DST varianty každého času:
#   CEST (letní, UTC+2):  9 / 12 / 15 / 18 Praha = 7 / 10 / 13 / 16 UTC
#   CET  (zimní, UTC+1):  9 / 12 / 15 / 18 Praha = 8 / 11 / 14 / 17 UTC

name: Weekly Results

on:
  schedule:
    # 09:00 Praha
    - cron: "0 7 * * 1"   # CEST
    - cron: "0 8 * * 1"   # CET
    # 12:00 Praha
    - cron: "0 10 * * 1"  # CEST
    - cron: "0 11 * * 1"  # CET
    # 15:00 Praha
    - cron: "0 13 * * 1"  # CEST
    - cron: "0 14 * * 1"  # CET
    # 18:00 Praha
    - cron: "0 16 * * 1"  # CEST
    - cron: "0 17 * * 1"  # CET
  workflow_dispatch:
    inputs:
      date:
        description: "Datum soboty víkendu (YYYY-MM-DD), prázdné = minulý víkend"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  send-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if already sent today
        id: check-sent
        # Pokud už dnes (Praha čas) existuje commit `data: update results …`,
        # další pokus tohoto dne skipne. Manuální spuštění (workflow_dispatch)
        # běží vždy.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run – proceeding."
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log --oneline --since="$(TZ=Europe/Prague date +%Y-%m-%dT00:00:00)" --grep="data: update results" | grep -q .; then
            echo "Výsledky už byly dnes (Praha čas) odeslány, přeskakuji."
            echo "already_sent=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check-sent.outputs.already_sent == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.check-sent.outputs.already_sent == 'false'
        run: pip install -r requirements.txt

      - name: Run agent
        if: steps.check-sent.outputs.already_sent == 'false'
        id: run-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          set +e
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python main.py --date "${{ github.event.inputs.date }}"
          else
            python main.py
          fi
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 75 ]; then
            echo "⏳ Výsledky nejsou finalizovány (PDGA ještě neindexovala?). Další pokus proběhne automaticky."
            echo "incomplete=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ $EXIT_CODE -ne 0 ]; then
            exit $EXIT_CODE
          fi
          echo "incomplete=false" >> "$GITHUB_OUTPUT"

      - name: Commit results marker
        if: steps.check-sent.outputs.already_sent == 'false' && steps.run-agent.outputs.incomplete != 'true'
        # Vždy vytvoříme commit (i prázdný), aby `already_sent` guard
        # zachytil i víkendy bez turnajů a další cron toho dne skipnul.
        run: |
          git config user.name "Gators Bot"
          git config user.email "bot@moraviangators.cz"
          DATE_TAG="$(TZ=Europe/Prague date +%Y-%m-%d)"
          git add data/
          if git diff --staged --quiet; then
            git commit --allow-empty -m "data: update results $DATE_TAG (no new data)"
          else
            git commit -m "data: update results $DATE_TAG"
          fi
          git push

      - name: Upload results artifact
        if: always() && steps.check-sent.outputs.already_sent == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_id }}
          path: output/
          retention-days: 30
