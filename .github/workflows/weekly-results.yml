# Moravian Gators – týdenní výsledky
# Každé pondělí ve večerním okně Europe/Prague (cíl ~18:00).
#
# Schedule pokrývá obě DST varianty + retry. GitHub Actions cron má
# tolerance až ~30 min, proto se NEspoléháme na přesnou hodinu –
# duplicitu řeší "already_sent today" guard níže (první úspěšný běh
# pushne commit `data: update results YYYY-MM-DD`, zbylé crony skipnou).
#
# CEST (letní čas, UTC+2):  16 UTC = 18 Praha (primary), 19 UTC = 21 Praha (retry)
# CET  (zimní čas, UTC+1):  17 UTC = 18 Praha (primary), 20 UTC = 21 Praha (retry)
#
# V přechodných měsících (3. a 10.) může být první primární běh o ±1 h
# vedle 18:00 – to je akceptovatelné, PDGA je už indexovaná.

name: Weekly Results

on:
  schedule:
    # Primary – 18:00 Praha
    - cron: "0 16 * * 1"  # CEST
    - cron: "0 17 * * 1"  # CET
    # Retry – 21:00 Praha (pro případ že PDGA ještě neindexovala nebo síť padla)
    - cron: "0 19 * * 1"  # CEST
    - cron: "0 20 * * 1"  # CET
  workflow_dispatch:
    inputs:
      date:
        description: "Datum soboty víkendu (YYYY-MM-DD), prázdné = minulý víkend"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  send-results:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if already sent today
        id: check-sent
        # Pokud už dnes existuje commit `data: update results …`, druhý běh skipne.
        # Manuální spuštění (workflow_dispatch) běží vždycky.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run – proceeding."
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git log --oneline --since="$(TZ=Europe/Prague date +%Y-%m-%dT00:00:00)" --grep="data: update results" | grep -q .; then
            echo "already_sent=true" >> "$GITHUB_OUTPUT"
            echo "Výsledky už byly dnes (Praha čas) odeslány, přeskakuji."
          else
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check-sent.outputs.already_sent == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.check-sent.outputs.already_sent == 'false'
        run: pip install -r requirements.txt

      - name: Run agent
        if: steps.check-sent.outputs.already_sent == 'false'
        id: run-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          set +e
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python main.py --date "${{ github.event.inputs.date }}"
          else
            python main.py
          fi
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 75 ]; then
            echo "⏳ Výsledky nejsou finalizovány. Další pokus proběhne automaticky."
            echo "incomplete=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ $EXIT_CODE -ne 0 ]; then
            exit $EXIT_CODE
          fi
          echo "incomplete=false" >> "$GITHUB_OUTPUT"

      - name: Commit cumulative data
        if: steps.check-sent.outputs.already_sent == 'false' && steps.run-agent.outputs.incomplete != 'true'
        run: |
          git config user.name "Gators Bot"
          git config user.email "bot@moraviangators.cz"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: update results $(TZ=Europe/Prague date +%Y-%m-%d)"
            git push
          fi

      - name: Upload results artifact
        if: always() && steps.check-sent.outputs.already_sent == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_id }}
          path: output/
          retention-days: 30
